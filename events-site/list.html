<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Список участников</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --text: #17212b; --muted: #5d6b78; --line: #d9e0e6;
  --accent: #0f6e78; --accent-ink: #ffffff; --accent-soft: #e3f1f2; --danger: #b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f151a; --card: #172028; --text: #e6edf2; --muted: #95a3af; --line: #2a3742;
    --accent: #4fb3bd; --accent-ink: #0b1418; --accent-soft: #1c3236; --danger: #f2827a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
input[type=search] { flex: 1 1 240px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; }
button { padding: 10px 16px; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 900px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
tr:last-child td { border-bottom: 0; }
td.n { color: var(--muted); font-variant-numeric: tabular-nums; }
td a { color: var(--accent); }
.err { color: var(--danger); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Участники конференции 06.11.2026</h1>
  <p class="sub" id="sub">Загрузка…</p>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Поиск по ФИО, телефону, месту работы…">
    <button id="csv" type="button">Скачать для Excel</button>
    <button id="refresh" type="button">Обновить</button>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>№</th><th>Дата</th><th>ФИО</th><th>Телефон</th><th>Email</th><th>Город</th><th>Место работы</th><th>Должность</th><th>Категория</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const SUPABASE_URL = "https://yssdpeqzvauxwhuktyvz.supabase.co";
const SUPABASE_KEY = "sb_publishable_MUnlj4xjmeOIa13wxkPgFw_XJkwL7Of";
const EVENT = "derma-2026-11";
const CAPACITY = 400;
const CAT = { doctor: "Врач", resident: "Резидент", student: "Студент", company: "Представитель компании", other: "Другое" };

// Ключ — в части ссылки после #: браузер не отправляет её на сервер.
const KEY = new URLSearchParams(location.hash.slice(1)).get("key") || "";
const $ = (id) => document.getElementById(id);
let all = [];

const fmt = (iso) => new Date(iso).toLocaleString("ru-RU", { timeZone: "Asia/Almaty", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  if (!KEY) { $("sub").innerHTML = '<span class="err">Откройте страницу по полной ссылке организатора (с ключом).</span>'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/event_registrations_list`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
      body: JSON.stringify({ p_event: EVENT, p_key: KEY }),
    });
    if (!res.ok) throw new Error((await res.text()).includes("forbidden") ? "forbidden" : "network");
    all = await res.json();
    render();
  } catch (e) {
    $("sub").innerHTML = `<span class="err">${e.message === "forbidden" ? "Неверная ссылка — ключ не подходит." : "Не удалось загрузить список. Проверьте интернет."}</span>`;
  }
}

function render() {
  $("sub").textContent = `Зарегистрировано ${all.length} из ${CAPACITY}. Обновлено ${new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}.`;
  const counts = {};
  for (const r of all) counts[r.category] = (counts[r.category] || 0) + 1;
  $("stats").innerHTML = [`<div class="stat"><b>${all.length}</b><span>всего</span></div>`,
    `<div class="stat"><b>${Math.max(0, CAPACITY - all.length)}</b><span>свободно</span></div>`,
    ...Object.keys(CAT).filter((k) => counts[k]).map((k) => `<div class="stat"><b>${counts[k]}</b><span>${CAT[k]}</span></div>`)].join("");
  const q = $("q").value.trim().toLowerCase();
  const rows = all.map((r, i) => ({ ...r, n: i + 1 }))
    .filter((r) => !q || [r.full_name, r.phone, r.email, r.city, r.workplace, r.position].join(" ").toLowerCase().includes(q));
  $("rows").innerHTML = rows.length ? rows.map((r) => `<tr><td class="n">${r.n}</td><td>${fmt(r.created_at)}</td><td>${esc(r.full_name)}</td>
    <td><a href="tel:${esc(r.phone.replace(/[^\d+]/g, ""))}">${esc(r.phone)}</a></td><td>${esc(r.email)}</td><td>${esc(r.city)}</td>
    <td>${esc(r.workplace)}</td><td>${esc(r.position)}</td><td>${CAT[r.category] || esc(r.category)}</td></tr>`).join("")
    : `<tr><td colspan="9" class="empty">${all.length ? "Ничего не найдено" : "Пока никто не зарегистрировался"}</td></tr>`;
}

function csv() {
  const head = ["№", "Дата регистрации", "ФИО", "Телефон", "Email", "Город", "Место работы", "Должность", "Категория"];
  const cell = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [head, ...all.map((r, i) => [i + 1, fmt(r.created_at), r.full_name, r.phone, r.email, r.city, r.workplace, r.position, CAT[r.category] || r.category])]
    .map((row) => row.map(cell).join(";"));
  // BOM + «;» — чтобы русский Excel сразу открыл кириллицу по столбцам.
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "uchastniki-06-11-2026.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("q").addEventListener("input", render);
$("csv").addEventListener("click", csv);
$("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
